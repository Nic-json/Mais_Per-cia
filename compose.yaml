services:
  app:
    build: .
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Pericias: Data Source=/data/pericias.db
      Documentos__Diretorio: /data/uploads
      DataProtection__KeysDirectory: /data/keys
      Admin__Email: ${ADMIN_EMAIL:?Configure ADMIN_EMAIL no arquivo .env}
      Admin__Password: ${ADMIN_PASSWORD:?Configure ADMIN_PASSWORD no arquivo .env}
      Billing__MonthlyPrice: ${BILLING_MONTHLY_PRICE:-70.00}
      Public__BaseUrl: https://${APP_DOMAIN:?Configure APP_DOMAIN no arquivo .env}
      Asaas__ApiKey: ${ASAAS_API_KEY:-}
      Asaas__WebhookToken: ${ASAAS_WEBHOOK_TOKEN:-}
      Asaas__BaseUrl: ${ASAAS_BASE_URL:-https://api-sandbox.asaas.com/v3}
      Email__SmtpHost: ${EMAIL_SMTP_HOST:-}
      Email__SmtpPort: ${EMAIL_SMTP_PORT:-587}
      Email__SmtpUser: ${EMAIL_SMTP_USER:-}
      Email__SmtpPassword: ${EMAIL_SMTP_PASSWORD:-}
      Email__FromAddress: ${EMAIL_FROM_ADDRESS:-}
      Email__FromName: ${EMAIL_FROM_NAME:-Perícia em Dia}
      Email__SupportAddress: ${EMAIL_SUPPORT_ADDRESS:-}
      Email__UseSsl: ${EMAIL_USE_SSL:-true}
      Service__OperatorName: ${SERVICE_OPERATOR_NAME:-}
      Service__LegalName: ${SERVICE_LEGAL_NAME:-}
      Service__TaxId: ${SERVICE_TAX_ID:-}
      Service__BusinessAddress: ${SERVICE_BUSINESS_ADDRESS:-}
    volumes:
      - pericias-data:/data
    expose:
      - "8080"
    networks:
      web: {}

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Configure APP_DOMAIN no arquivo .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      web:
        ipv4_address: 172.30.253.2

  backup:
    build:
      context: ./ops/backup
    profiles: ["backup"]
    restart: "no"
    env_file:
      - path: ./backup.env
        required: false
    volumes:
      - pericias-data:/data

volumes:
  pericias-data:
  caddy-data:
  caddy-config:

networks:
  web:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.253.0/28
          ip_range: 172.30.253.8/29
